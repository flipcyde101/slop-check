name: Bug
description: slop-check crashed, printed something wrong, or the Action failed.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and the full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: slop-check version, Node.js version and OS
